spring.application.name=API-GATEWAY

server.port=8090

# =========================
# Eureka
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================
# User Service Route
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# =========================
# Vehicle Service Route
# =========================
spring.cloud.gateway.server.webflux.routes[1].id=vehicle-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://VEHICLE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/vehicles/**

# =========================
# Booking Service Route
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/bookings/**

driveease.jwt.secret=DriveEaseSuperSecretKeyForDevelopmentOnly123456789